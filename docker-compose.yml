services:
  db:
    image: mysql:8.0
    container_name: todolist-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: 1234
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uapp_user", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: todoapp:3.0.0
    container_name: todolist-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
